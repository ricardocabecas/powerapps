              ="As variáveis numéricas são tratadas como categorias (um valor = uma categoria). Na tabela colada, a 1.ª linha e a 1.ª coluna podem ter os nomes das categorias. Na aderência usa-se a 1.ª coluna de números. As proporções esperadas podem ser proporções, percentagens ou pesos: são normalizadas para somar 1."
            X: =24
