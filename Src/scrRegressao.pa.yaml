      - lblRegNotas:
          Control: Label
          Properties:
            Text: ="Notas" & Char(10) & Char(10) & "• Só entram os pares com x e y preenchidos." & Char(10) & Char(10) & "• r mede a intensidade da relação LINEAR (−1 ≤ r ≤ 1); r = 0 não exclui outras relações." & Char(10) & Char(10) & "• R² é a proporção da variabilidade de y explicada pela reta." & Char(10) & Char(10) & "• A reta dos mínimos quadrados minimiza Σ(yᵢ − ŷᵢ)². Previsões fora do intervalo dos x observados (extrapolação) são pouco fiáveis." & Char(10) & Char(10) & "• Correlação não implica causalidade."
            X: =24
            Y: =304
            Width: =284
            Height: =440
            Font: =Font.'Segoe UI'
            Size: =10
            Color: =RGBA(90, 98, 106, 1)
            VerticalAlign: =VerticalAlign.Top
      - htmRegressao:
          Control: HtmlViewer
          Properties:
            HtmlText: |-
              =With({_R: With(
                      {_p: Filter(ForAll(colDados As _d, {x: Switch(Switch(drpRegX.Selected.Value, varNomes.N1, 1, varNomes.N2, 2, varNomes.N3, 3, 1), 1, _d.N1, 2, _d.N2, _d.N3), y: Switch(Switch(drpRegY.Selected.Value, varNomes.N1, 1, varNomes.N2, 2, varNomes.N3, 3, 1), 1, _d.N1, 2, _d.N2, _d.N3)}), !IsBlank(x) && !IsBlank(y)), _x0: IfError(Value(Substitute(Substitute(Substitute(Substitute(Trim(txtRegX0.Text), " ", ""), UniChar(160), ""), UniChar(8239), ""), ",", "."), "en-US"), Blank())},
                      With({_n: CountRows(_p)},
                      With({_mx: If(_n > 0, Average(_p, x)), _my: If(_n > 0, Average(_p, y))},
                      With(
                          // Somas de quadrados e de produtos dos desvios em relação às médias
                          {_Sxx: Sum(_p, Power(x - _mx, 2)), _Syy: Sum(_p, Power(y - _my, 2)), _Sxy: Sum(_p, (x - _mx) * (y - _my))},
                      With(
                          {_b: If(_n >= 2 && _Sxx > 0, _Sxy / _Sxx),
                           _r: If(_n >= 2 && _Sxx > 0 && _Syy > 0, _Sxy / Sqrt(_Sxx * _Syy))},
                      {
                          n: _n, mediaX: _mx, mediaY: _my,
                          Sxx: If(_n > 0, _Sxx), Syy: If(_n > 0, _Syy), Sxy: If(_n > 0, _Sxy),
                          sx: If(_n >= 2, Sqrt(_Sxx / (_n - 1))), sy: If(_n >= 2, Sqrt(_Syy / (_n - 1))),
                          // Covariância amostral
                          cov: If(_n >= 2, _Sxy / (_n - 1)),
                          r: _r,
                          r2: If(!IsBlank(_r), _r * _r),
                          // Reta dos mínimos quadrados: ŷ = a + b·x
                          b: _b,
                          a: If(!IsBlank(_b), _my - _b * _mx),
                          minX: Min(_p, x), maxX: Max(_p, x), minY: Min(_p, y), maxY: Max(_p, y),
                          x0: _x0,
                          previsao: If(!IsBlank(_b) && !IsBlank(_x0), _my - _b * _mx + _b * _x0),
                          // Teste H0: ρ = 0  —  t = r √(n − 2) / √(1 − r²), com n − 2 graus de liberdade
                          glR: If(_n >= 3 && !IsBlank(_r), _n - 2),
                          tR: If(_n >= 3 && !IsBlank(_r) && _r * _r < 1, _r * Sqrt((_n - 2) / (1 - _r * _r))),
                          pR: If(_n >= 3 && !IsBlank(_r),
                                 If(_r * _r >= 1, 0,
                                    With({_f: Power(_r * Sqrt((_n - 2) / (1 - _r * _r)), 2), _d1: 1, _d2: _n - 2},
                                        If(_f <= 0, 1,
                                        With({_t0: Atan(Sqrt(_d1 * _f / _d2)), _sg: 1 / Sqrt(Max(_d1 + _d2 - 2, 1)),
                                              _ts: If(_d2 > 1, Atan(Sqrt(Max(_d1 - 1, 0) / (_d2 - 1))), Pi() / 2)},
                                        With({_lo: Max(0, _ts - 10 * _sg), _hi: Min(Pi() / 2, _ts + 10 * _sg)},
                                            If(_t0 >= _hi, 0,
                                                With({_nd: ForAll(Sequence(300, 0) As _i, With({_s: RoundDown(_i.Value / 3, 0), _m: Mod(_i.Value, 3)}, {u: (_s + 0.5 + (_m - 1) * 0.3872983346207417) / 100, w: If(_m = 1, 8 / 9, 5 / 9) / 200}))},
                                            With({_Ltot: ForAll(_nd, With({t: _lo + u * (_hi - _lo)}, {L: (_d1 - 1) * Ln(Sin(t)) + (_d2 - 1) * Ln(Cos(t)), w: w * (_hi - _lo)})),
                                                  _Lcau: ForAll(_nd, With({t: Max(_t0, _lo) + u * (_hi - Max(_t0, _lo))}, {L: (_d1 - 1) * Ln(Sin(t)) + (_d2 - 1) * Ln(Cos(t)), w: w * (_hi - Max(_t0, _lo))}))},
                                                With({_M: Max(_Ltot, L)},
                                                    Min(1, Sum(_Lcau, Exp(L - _M) * w) / Sum(_Ltot, Exp(L - _M) * w))))))))))))
                      }
                      ))))
                  )},
                  "<div style='font-family:Segoe UI,Arial;font-size:13px;color:#212529'>" &
                  "<table style='border-collapse:collapse;width:100%'>" &
                  "<tr style='background:#1f4e79;color:#ffffff'><th style='text-align:left;padding:6px 8px'>Medida e fórmula</th>" &
                  "<th style='text-align:right;padding:6px 8px'>Valor</th></tr>" &
                  "<tr><td style='padding:4px 8px'>N.º de pares (x, y)<br><span style='color:#5a626a;font-size:12px'>n</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.n}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 0.5, 0, _v), "[$-en-US]#,##0", "pt-PT"))) & "</td></tr>" &
                  "<tr style='background:#f3f6fa'><td style='padding:4px 8px'>Média de x<br><span style='color:#5a626a;font-size:12px'>x̄</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.mediaX}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr><td style='padding:4px 8px'>Média de y<br><span style='color:#5a626a;font-size:12px'>ȳ</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.mediaY}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr style='background:#f3f6fa'><td style='padding:4px 8px'>Desvio padrão amostral de x<br><span style='color:#5a626a;font-size:12px'>s<sub>x</sub></span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.sx}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr><td style='padding:4px 8px'>Desvio padrão amostral de y<br><span style='color:#5a626a;font-size:12px'>s<sub>y</sub></span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.sy}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr style='background:#f3f6fa'><td style='padding:4px 8px'>Soma dos quadrados de x<br><span style='color:#5a626a;font-size:12px'>Sxx = Σ(xᵢ − x̄)²</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.Sxx}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr><td style='padding:4px 8px'>Soma dos quadrados de y<br><span style='color:#5a626a;font-size:12px'>Syy = Σ(yᵢ − ȳ)²</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.Syy}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr style='background:#f3f6fa'><td style='padding:4px 8px'>Soma dos produtos<br><span style='color:#5a626a;font-size:12px'>Sxy = Σ(xᵢ − x̄)(yᵢ − ȳ)</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.Sxy}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr><td style='padding:4px 8px'>Covariância amostral<br><span style='color:#5a626a;font-size:12px'>s<sub>xy</sub> = Sxy / (n − 1)</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.cov}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr style='background:#f3f6fa'><td style='padding:4px 8px'>Coeficiente de correlação de Pearson<br><span style='color:#5a626a;font-size:12px'>r = Sxy / √(Sxx·Syy)</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.r}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr><td style='padding:4px 8px'>Coeficiente de determinação<br><span style='color:#5a626a;font-size:12px'>R² = r²</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.r2}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr style='background:#f3f6fa'><td style='padding:4px 8px'>Declive<br><span style='color:#5a626a;font-size:12px'>b = Sxy / Sxx</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.b}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr><td style='padding:4px 8px'>Ordenada na origem<br><span style='color:#5a626a;font-size:12px'>a = ȳ − b·x̄</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.a}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr style='background:#f3f6fa'><td style='padding:4px 8px'>Equação da reta</td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & If(IsBlank(_R.b), "não definida", "ŷ = " & With({_v: _R.a}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & If(_R.b < 0, " − ", " + ") & With({_v: Abs(_R.b)}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & " · x") & "</td></tr>" &
                  "<tr><td style='padding:4px 8px'>Correlação (indicativo)<br><span style='color:#5a626a;font-size:12px'>|r| < 0,3 fraca · < 0,7 moderada</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & If(IsBlank(_R.r), "não definida",
                      With({_ar: Abs(_R.r)}, If(_ar < 0.3, "fraca", _ar < 0.7, "moderada", "forte")) & " e " &
                      If(_R.r > 0, "positiva", _R.r < 0, "negativa", "nula")) & "</td></tr>" &
                  "<tr style='background:#f3f6fa'><td style='padding:4px 8px'>Teste H₀: ρ = 0 (estatística t)<br><span style='color:#5a626a;font-size:12px'>t = r √(n − 2) / √(1 − r²)</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.tR}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</td></tr>" &
                  "<tr><td style='padding:4px 8px'>Graus de liberdade<br><span style='color:#5a626a;font-size:12px'>gl = n − 2</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_v: _R.glR}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 0.5, 0, _v), "[$-en-US]#,##0", "pt-PT"))) & "</td></tr>" &
                  "<tr style='background:#f3f6fa'><td style='padding:4px 8px'>Valor de p (bilateral)<br><span style='color:#5a626a;font-size:12px'>p = P(|T| ≥ |t|)</span></td><td style='padding:4px 8px;text-align:right;white-space:nowrap'>" & With({_pp: _R.pR}, If(IsBlank(_pp), "n.d.", _pp < 0.0001, "< 0,0001", With({_v: _pp}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))))) & "</td></tr>" &
                  "</table>" &
                  "<h4 style='margin:14px 0 4px 0;color:#1f4e79'>Previsão</h4>" &
                  If(IsBlank(_R.x0), "<p>Escreva um valor de x para obter a previsão ŷ.</p>",
                      IsBlank(_R.previsao), "<p>Não é possível prever: a reta não está definida.</p>",
                      "<p style='font-size:15px'>Para x = " & With({_r: Round(_R.x0, 4)}, If(_r = Int(_r), Text(_r, "[$-en-US]0", "pt-PT"), Text(_r, "[$-en-US]0.####", "pt-PT"))) & ": <b>ŷ = " & With({_v: _R.previsao}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 5e-05, 0, _v), "[$-en-US]#,##0.0000", "pt-PT"))) & "</b></p>" &
                      If(_R.x0 < _R.minX || _R.x0 > _R.maxX,
                          "<p style='color:#b00020'>⚠ Extrapolação: x está fora do intervalo observado [" & With({_r: Round(_R.minX, 4)}, If(_r = Int(_r), Text(_r, "[$-en-US]0", "pt-PT"), Text(_r, "[$-en-US]0.####", "pt-PT"))) &
                          " ; " & With({_r: Round(_R.maxX, 4)}, If(_r = Int(_r), Text(_r, "[$-en-US]0", "pt-PT"), Text(_r, "[$-en-US]0.####", "pt-PT"))) & "]; a previsão é pouco fiável.</p>", "")) &
                  If(_R.n < 2, "<p style='color:#b00020'>São precisos pelo menos 2 pares de valores.</p>",
                      IsBlank(_R.b), "<p style='color:#b00020'>Todos os valores de x são iguais (Sxx = 0): a reta e r não estão definidos.</p>",
                      IsBlank(_R.r), "<p style='color:#b00020'>Todos os valores de y são iguais (Syy = 0): r não está definido.</p>", "") &
                  "</div>"
              )
            X: =332
