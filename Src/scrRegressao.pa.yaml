                                        With({_Ltot: ForAll(_nd, With({t: _lo + u * (_hi - _lo)}, {L: (_d1 - 1) * Ln(Sin(t)) + (_d2 - 1) * Ln(Cos(t)), w: w * (_hi - _lo)})),
                                              _Lcau: ForAll(_nd, With({t: Max(_t0, _lo) + u * (_hi - Max(_t0, _lo))}, {L: (_d1 - 1) * Ln(Sin(t)) + (_d2 - 1) * Ln(Cos(t)), w: w * (_hi - Max(_t0, _lo))}))},
                                            With({_M: Max(_Ltot, L)},
