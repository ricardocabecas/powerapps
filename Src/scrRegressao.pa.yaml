                  {
                      n: _n, mediaX: _mx, mediaY: _my,
                      Sxx: If(_n > 0, _Sxx), Syy: If(_n > 0, _Syy), Sxy: If(_n > 0, _Sxy),
                      sx: If(_n >= 2, Sqrt(_Sxx / (_n - 1))), sy: If(_n >= 2, Sqrt(_Syy / (_n - 1))),
