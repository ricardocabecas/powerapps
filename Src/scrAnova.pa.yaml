              ="Notas" & Char(10) & Char(10) & "• Formato «variável + fator»: cada linha da tabela de dados é uma observação; o fator diz a que grupo pertence." & Char(10) & Char(10) & "• Formato «colunas como grupos»: cada variável numérica (" & varNomes.N1 & ", " & varNomes.N2 & ", " & varNomes.N3 & ") é um grupo; colunas vazias são ignoradas." & Char(10) & Char(10) & "• Com 2 grupos, a ANOVA dá o mesmo valor de p do teste t com variâncias iguais (F = t²)."
            X: =24
            Y: =326
