                    "Conclusão: ao nível de significância de " & With({_r: Round(_R.alfa * 100, 4)}, If(_r = Int(_r), Text(_r, "[$-en-US]0", "pt-PT"), Text(_r, "[$-en-US]0.####", "pt-PT"))) & " %" & ", não há evidência estatística suficiente de que " & Switch(_R.tipo,
                    1, "a média de " & Substitute(Substitute(Substitute(drpTtVar.Selected.Value, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & " é " & Switch(_R.alt, 1, "diferente de", 2, "menor do que", "maior do que") & " " & With({_r: Round(_R.d0, 4)}, If(_r = Int(_r), Text(_r, "[$-en-US]0", "pt-PT"), Text(_r, "[$-en-US]0.####", "pt-PT"))),
                    4, "a média das diferenças (" & Substitute(Substitute(Substitute(drpTtVar.Selected.Value, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & " − " & Substitute(Substitute(Substitute(drpTtVar2.Selected.Value, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & ") é " & Switch(_R.alt, 1, "diferente de", 2, "menor do que", "maior do que") & " " & With({_r: Round(_R.d0, 4)}, If(_r = Int(_r), Text(_r, "[$-en-US]0", "pt-PT"), Text(_r, "[$-en-US]0.####", "pt-PT"))),
                    If(_R.d0 = 0,
                       "a média de " & Substitute(Substitute(Substitute(drpTtVar.Selected.Value, "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & " em «" & Substitute(Substitute(Substitute(If(_R.tipo = 4, "D", If(drpTtFormato.Selected.Value = "Duas colunas numéricas", drpTtVar.Selected.Value, drpTtGrupoA.Selected.Value)), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "» é " & Switch(_R.alt, 1, "diferente da", 2, "menor do que a", "maior do que a") & " média em «" & Substitute(Substitute(Substitute(If(drpTtFormato.Selected.Value = "Duas colunas numéricas", drpTtVar2.Selected.Value, drpTtGrupoB.Selected.Value), "&", "&amp;"), "<", "&lt;"), ">", "&gt;") & "»",
                       "a diferença entre as médias (μ₁ − μ₂) é " & Switch(_R.alt, 1, "diferente de", 2, "menor do que", "maior do que") & " " & With({_r: Round(_R.d0, 4)}, If(_r = Int(_r), Text(_r, "[$-en-US]0", "pt-PT"), Text(_r, "[$-en-US]0.####", "pt-PT"))))) & ".</div>")) &
            If((_R.tipo = 2 || _R.tipo = 3) && _R.v1 > 0 && _R.v2 > 0,
                "<p style='color:#5a626a;font-size:12px'>Razão entre a maior e a menor variância: " &
                With({_v: Max(_R.v1, _R.v2) / Min(_R.v1, _R.v2)}, If(IsBlank(_v), "n.d.", Text(If(Abs(_v) < 0.005, 0, _v), "[$-en-US]#,##0.00", "pt-PT"))) &
                ". Regra prática: se for superior a 4, prefira o teste de Welch (não assume variâncias iguais).</p>", "") &
            "</div>"
        )
