      Color: =RGBA(31, 78, 121, 1)
      HoverFill: =RGBA(222, 235, 247, 1)
      HoverColor: =RGBA(31, 78, 121, 1)
      BorderColor: =RGBA(31, 78, 121, 1)
      BorderThickness: =1
      DisplayMode: =If(CountRows(colColagem) > 0, DisplayMode.Edit, DisplayMode.Disabled)
