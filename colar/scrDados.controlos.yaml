                    ForAll(Filter(_reg, _IN3) As _x, {Linha: _x.Linha, Variavel: _nomes.N3, Texto: _x._TN3})
                        ), Linha),
                        Cabecalho: _cab,
                        Nomes: _nomes
                    }
