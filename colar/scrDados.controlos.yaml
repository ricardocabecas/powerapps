- galDados:
    Control: Gallery
    Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
    Properties:
      Items: =colDados
      X: =16
      Y: =166
      Width: =700
      Height: =500
      TemplateSize: =40
      TemplatePadding: =0
      ShowScrollbar: =true
      BorderColor: =RGBA(206, 212, 218, 1)
      BorderThickness: =1
      Fill: =RGBA(255, 255, 255, 1)
      TemplateFill: =If(Mod(ThisItem.Id, 2) = 0, RGBA(248, 249, 250, 1), RGBA(255, 255, 255, 1))
    Children:
      - lblGalId:
          Control: Label
          Properties:
            Text: =ThisItem.Id
            X: =0
            Y: =4
            Width: =44
            Height: =32
            Font: =Font.'Segoe UI'
            Size: =11
            Color: =RGBA(90, 98, 106, 1)
            Align: =Align.Center
      - txtGalN1:
          Control: Classic/TextInput
          Properties:
            Default: |-
              =With({_v: ThisItem.N1}, If(IsBlank(_v), "", If(_v = Int(_v), Text(_v, "[$-en-US]0", "pt-PT"), Text(_v, "[$-en-US]0.##########", "pt-PT"))))
            OnChange: |-
              =// Converte o texto (vírgula ou ponto decimal) e grava na coleção
              Patch(colDados, LookUp(colDados, Id = ThisItem.Id), {N1: IfError(Value(Substitute(Substitute(Substitute(Substitute(Trim(Self.Text), " ", ""), UniChar(160), ""), UniChar(8239), ""), ",", "."), "en-US"), Blank())});
              If((Len(Trim(Self.Text)) > 0 && IsError(Value(Substitute(Substitute(Substitute(Substitute(Trim(Self.Text), " ", ""), UniChar(160), ""), UniChar(8239), ""), ",", "."), "en-US"))),
                  Notify("«" & Self.Text & "» não é um número válido: a célula ficou vazia.", NotificationType.Warning))
            X: =48
            Y: =4
            Width: =112
            Height: =32
            Font: =Font.'Segoe UI'
            Size: =11
            Align: =Align.Right
            BorderColor: =If((Len(Trim(Self.Text)) > 0 && IsError(Value(Substitute(Substitute(Substitute(Substitute(Trim(Self.Text), " ", ""), UniChar(160), ""), UniChar(8239), ""), ",", "."), "en-US"))), RGBA(176, 0, 32, 1), RGBA(206, 212, 218, 1))
            HintText: ="vazio"
      - txtGalN2:
          Control: Classic/TextInput
          Properties:
            Default: |-
              =With({_v: ThisItem.N2}, If(IsBlank(_v), "", If(_v = Int(_v), Text(_v, "[$-en-US]0", "pt-PT"), Text(_v, "[$-en-US]0.##########", "pt-PT"))))
            OnChange: |-
              =// Converte o texto (vírgula ou ponto decimal) e grava na coleção
              Patch(colDados, LookUp(colDados, Id = ThisItem.Id), {N2: IfError(Value(Substitute(Substitute(Substitute(Substitute(Trim(Self.Text), " ", ""), UniChar(160), ""), UniChar(8239), ""), ",", "."), "en-US"), Blank())});
              If((Len(Trim(Self.Text)) > 0 && IsError(Value(Substitute(Substitute(Substitute(Substitute(Trim(Self.Text), " ", ""), UniChar(160), ""), UniChar(8239), ""), ",", "."), "en-US"))),
                  Notify("«" & Self.Text & "» não é um número válido: a célula ficou vazia.", NotificationType.Warning))
            X: =164
            Y: =4
            Width: =112
            Height: =32
            Font: =Font.'Segoe UI'
            Size: =11
            Align: =Align.Right
            BorderColor: =If((Len(Trim(Self.Text)) > 0 && IsError(Value(Substitute(Substitute(Substitute(Substitute(Trim(Self.Text), " ", ""), UniChar(160), ""), UniChar(8239), ""), ",", "."), "en-US"))), RGBA(176, 0, 32, 1), RGBA(206, 212, 218, 1))
            HintText: ="vazio"
      - txtGalN3:
          Control: Classic/TextInput
          Properties:
            Default: |-
              =With({_v: ThisItem.N3}, If(IsBlank(_v), "", If(_v = Int(_v), Text(_v, "[$-en-US]0", "pt-PT"), Text(_v, "[$-en-US]0.##########", "pt-PT"))))
            OnChange: |-
              =// Converte o texto (vírgula ou ponto decimal) e grava na coleção
              Patch(colDados, LookUp(colDados, Id = ThisItem.Id), {N3: IfError(Value(Substitute(Substitute(Substitute(Substitute(Trim(Self.Text), " ", ""), UniChar(160), ""), UniChar(8239), ""), ",", "."), "en-US"), Blank())});
              If((Len(Trim(Self.Text)) > 0 && IsError(Value(Substitute(Substitute(Substitute(Substitute(Trim(Self.Text), " ", ""), UniChar(160), ""), UniChar(8239), ""), ",", "."), "en-US"))),
                  Notify("«" & Self.Text & "» não é um número válido: a célula ficou vazia.", NotificationType.Warning))
            X: =280
            Y: =4
            Width: =112
            Height: =32
            Font: =Font.'Segoe UI'
            Size: =11
            Align: =Align.Right
            BorderColor: =If((Len(Trim(Self.Text)) > 0 && IsError(Value(Substitute(Substitute(Substitute(Substitute(Trim(Self.Text), " ", ""), UniChar(160), ""), UniChar(8239), ""), ",", "."), "en-US"))), RGBA(176, 0, 32, 1), RGBA(206, 212, 218, 1))
            HintText: ="vazio"
      - txtGalC1:
          Control: Classic/TextInput
          Properties:
            Default: =ThisItem.C1
            OnChange: |-
              =Patch(colDados, LookUp(colDados, Id = ThisItem.Id), {C1: Trim(Self.Text)})
            X: =396
            Y: =4
            Width: =112
            Height: =32
            Font: =Font.'Segoe UI'
            Size: =11
            BorderColor: =RGBA(206, 212, 218, 1)
            HintText: ="vazio"
      - txtGalC2:
          Control: Classic/TextInput
          Properties:
            Default: =ThisItem.C2
            OnChange: |-
              =Patch(colDados, LookUp(colDados, Id = ThisItem.Id), {C2: Trim(Self.Text)})
            X: =512
            Y: =4
            Width: =112
            Height: =32
            Font: =Font.'Segoe UI'
            Size: =11
            BorderColor: =RGBA(206, 212, 218, 1)
            HintText: ="vazio"
      - btnGalApagar:
          Control: Classic/Button
          Properties:
            Text: ="✕"
            OnSelect: |-
              =// Apaga a linha e volta a numerar 1..n
              RemoveIf(colDados, Id = ThisItem.Id);
              ClearCollect(colTemp, ForAll(Sequence(CountRows(colDados)) As _i, Patch(Index(colDados, _i.Value), {Id: _i.Value})));
              ClearCollect(colDados, colTemp);
              Clear(colTemp)
            X: =628
            Y: =6
            Width: =32
            Height: =28
            Font: =Font.'Segoe UI'
            Size: =11
            Fill: =RGBA(255, 255, 255, 1)
            Color: =RGBA(176, 0, 32, 1)
            BorderColor: =RGBA(206, 212, 218, 1)
            BorderThickness: =1
            HoverFill: =RGBA(253, 236, 238, 1)
            HoverColor: =RGBA(176, 0, 32, 1)
            Tooltip: ="Apagar esta linha"
